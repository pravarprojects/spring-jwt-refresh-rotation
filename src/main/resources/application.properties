# ---------------------------------------------------------------
# Every value can be overridden with an environment variable,
# so this service can be dropped into any stack without edits.
# Syntax: ${ENV_VAR:default}
# ---------------------------------------------------------------

server.port=${SERVER_PORT:8080}

# Database (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jwt_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.main.allow-circular-references=true
logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}

# JWT signing key: Base64-encoded, at least 256 bits (32 bytes) for HS256.
# Generate one with:  openssl rand -base64 32
token.secret.key=${JWT_SECRET}

# Token lifetimes and session policy
auth.access-token.ttl-ms=${ACCESS_TOKEN_TTL_MS:600000}
auth.refresh-token.ttl-ms=${REFRESH_TOKEN_TTL_MS:1200000}
auth.max-sessions=${MAX_SESSIONS:5}
